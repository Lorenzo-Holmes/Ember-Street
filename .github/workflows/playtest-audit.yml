name: Playtest Audit

on:
  push:
    branches: ["feat/v06x-playtest-audit", "feat/v06x-audit-v2-cooldown", "feat/v06x-night-cadence-v2", "feat/v06x-balance-integration"]
  workflow_dispatch:
    inputs:
      policy_runs:
        description: Baseline runs per policy
        required: false
        default: "200"
      principle_runs:
        description: Runs per isolated principle
        required: false
        default: "80"
      curve_runs:
        description: Daily pressure-curve runs per policy
        required: false
        default: "120"
      v2_runs:
        description: Corrected V2 baseline runs per policy
        required: false
        default: "240"
      controlled_runs:
        description: Controlled resident runs per policy/count
        required: false
        default: "80"
      repeat_runs:
        description: Night diversity runs per V2 policy
        required: false
        default: "150"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRITE_PLAYTEST_AUDIT: "1"
      PLAYTEST_POLICY_RUNS: ${{ inputs.policy_runs || '200' }}
      PLAYTEST_PRINCIPLE_RUNS: ${{ inputs.principle_runs || '80' }}
      PLAYTEST_CURVE_RUNS: ${{ inputs.curve_runs || '120' }}
      PLAYTEST_V2_RUNS: ${{ inputs.v2_runs || '240' }}
      PLAYTEST_CONTROLLED_RUNS: ${{ inputs.controlled_runs || '80' }}
      PLAYTEST_REPEAT_RUNS: ${{ inputs.repeat_runs || '150' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run DAY1→30 audit matrix
        run: npx vitest run qa/playtest/playtest-audit-report.test.ts qa/playtest/pressure-curves.test.ts qa/playtest/audit-v2-methodology.test.ts qa/playtest/repeat-cooldown-evaluation.test.ts qa/playtest/day29-scenario-matrix.test.ts qa/playtest/day29-stress-scenarios.test.ts qa/playtest/day29-ending-utility.test.ts --reporter=verbose

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: ember-street-playtest-audit
          path: qa/playtest/out/
          if-no-files-found: error
          retention-days: 14
