name: Apply v0.6 Foundation Migration

on:
  push:
    branches: [feat/v060-day-shift-long-night]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v060-day-shift-long-night
          fetch-depth: 0
      - name: Apply migration
        run: node scripts/apply-v060-foundation.mjs
      - name: Commit migrated foundation
        run: |
          if git diff --quiet; then
            echo "No migration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/engine.ts
          git commit -m "feat: initialize game state v3"
          git push origin HEAD:feat/v060-day-shift-long-night
