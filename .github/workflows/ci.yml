name: CI

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Codespaces devcontainer
        run: node -e "JSON.parse(require('fs').readFileSync('.devcontainer/devcontainer.json', 'utf8'))"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Audit canonical visual package
        run: npm run audit:assets:strict

      - name: Production web build
        run: npm run build

      - name: Validate Cloudflare deployment
        run: npx wrangler deploy --dry-run

      - name: Production Xiaohongshu build
        run: npm run build:xhs

      - name: Audit Xiaohongshu offline package
        run: npm run audit:xhs
