name: Package Xiaohongshu Mini Tool

on:
  push:
    branches:
      - "chore/xhs-release-package-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Audit approved A01-A29 package
        run: npm run audit:assets:strict

      - name: Production build
        run: npm run build

      - name: Audit Xiaohongshu offline package
        run: npm run audit:xhs

      - name: Create submission ZIP
        run: |
          cd dist
          zip -r ../ember-street-xhs-20260903.zip .
          cd ..
          sha256sum ember-street-xhs-20260903.zip | tee ember-street-xhs-20260903.sha256

      - name: Upload submission artifact
        uses: actions/upload-artifact@v4
        with:
          name: ember-street-xhs-20260903
          path: |
            ember-street-xhs-20260903.zip
            ember-street-xhs-20260903.sha256
          if-no-files-found: error
          retention-days: 14
