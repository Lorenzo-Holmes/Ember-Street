name: Human Production Playtest

on:
  push:
    branches:
      - qa/human-playtest-20260905
      - qa/location-value-human-20260905
    paths:
      - 'qa/human-production/**'
      - 'playwright.human.config.ts'
      - '.github/workflows/human-production-playtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  human-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_URL: https://ember-street.1106314996.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck playtest branch
        run: npm run typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production endpoint
        run: curl --fail --silent --show-error --location --max-time 20 "$PRODUCTION_URL/" -o /tmp/ember-street-production.html

      - name: Run human strategy playtests
        run: npx playwright test --config=playwright.human.config.ts

      - name: Upload human playtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-production-playtest-evidence
          path: |
            test-results
            playwright-human-report
          if-no-files-found: warn
