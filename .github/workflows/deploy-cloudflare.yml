name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run release-blocker browser smoke
        run: npm run test:release-blocker

      - name: Upload release-gate browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-browser-evidence
          path: |
            test-results
            playwright-report
          if-no-files-found: warn

  deploy:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        shell: bash
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '\r\n')"
          CLOUDFLARE_ACCOUNT_ID_CLEAN="$(printf '%s' "$CF_ACCOUNT_ID_RAW" | tr -d '\r\n')"
          if [ -n "$CLOUDFLARE_ACCOUNT_ID_CLEAN" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID_CLEAN"
          fi
          npx wrangler deploy

  post-deploy-live-playtest:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_URL: https://ember-street.1106314996.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production endpoint
        shell: bash
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent --show-error --location --max-time 20 "$PRODUCTION_URL/" -o /tmp/ember-street-production.html; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Run live production playtest
        run: npx playwright test --config=playwright.production.config.ts

      - name: Upload live production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-live-production-evidence
          path: |
            test-results
            playwright-production-report
          if-no-files-found: warn
