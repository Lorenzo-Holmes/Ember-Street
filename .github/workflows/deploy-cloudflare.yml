name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run release-blocker browser smoke
        run: npm run test:release-blocker

      - name: Upload release-gate browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-browser-evidence
          path: |
            test-results
            playwright-report
          if-no-files-found: warn

  deploy:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        shell: bash
        env:
          CF_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_API_TOKEN_RAW" | tr -d '\r\n')"
          CLOUDFLARE_ACCOUNT_ID_CLEAN="$(printf '%s' "$CF_ACCOUNT_ID_RAW" | tr -d '\r\n')"
          if [ -n "$CLOUDFLARE_ACCOUNT_ID_CLEAN" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID_CLEAN"
          fi
          npx wrangler deploy
