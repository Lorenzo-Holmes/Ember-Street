name: Apply v0.5 Story Migration

on:
  push:
    branches: [feat/v050-living-street]
    paths:
      - .github/workflows/apply-v050-story-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v050-living-street

      - name: Apply migration
        run: node scripts/apply-v050-story-migration.mjs

      - name: Commit migrated Story Pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/story.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: spread Story Pool across thirty days"
          git push origin HEAD:feat/v050-living-street
