name: Fix Audit Peak Sampling

on:
  push:
    branches:
      - fix/night-event-recent-cooldown-20260905
    paths:
      - '.github/workflows/patch-audit-peak.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/night-event-recent-cooldown-20260905
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix audit sampling and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/game/v060/playtestAuditV2.ts')
          text = path.read_text(encoding='utf-8')
          old = """  for (let guard = 0; guard < 30 && state.phase !== 'ending'; guard += 1) {\n    state = injectResidents(state, options);\n    state = resolvePrompts(state, policy);"""
          new = """  for (let guard = 0; guard < 30 && state.phase !== 'ending'; guard += 1) {\n    state = injectResidents(state, options);\n    peakResidents = Math.max(peakResidents, state.civilianResidents);\n    state = resolvePrompts(state, policy);"""
          if old not in text:
            raise SystemExit('audit peak patch target not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          npm install --no-audit --no-fund
          npm run typecheck
          npm test -- --run tests/playtest-audit-v2-v060.test.ts tests/night-repeat-cooldown-v060.test.ts tests/night-recent-selection-v060.test.ts
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/v060/playtestAuditV2.ts
          git commit -m "test(audit): sample injected resident peaks before night losses"
          git push origin HEAD:fix/night-event-recent-cooldown-20260905
